networks:
  mdm_network:
    driver: bridge
    name: centralizacion_net
    ipam:
      config:
        - subnet: 10.50.0.0/16

services:

  # ────────────────────────────────────────────────────────────────────────────
  # API REST — FastAPI / Uvicorn
  # ────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centralizacion_api
    restart: unless-stopped
    env_file: .env          # MYSQL_HOST, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    ports:
      - "8002:8002"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    networks:
      - mdm_network


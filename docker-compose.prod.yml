# docker-compose.prod.yml — Servidor Hostinger
# Servicios: FastAPI (la base de datos es MySQL remoto en Hostinger)
# El Nginx del servidor gestiona el proxy inverso externamente.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api

networks:
  mdm_network:
    driver: bridge
    name: centralizacion_net_prod
    ipam:
      config:
        - subnet: 10.60.0.0/16

services:

  # ────────────────────────────────────────────────────────────────────────────
  # API REST — FastAPI / Uvicorn
  # ────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centralizacion_api
    restart: unless-stopped
    env_file: .env          # MYSQL_HOST, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    ports:
      - "8002:8002"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --workers 1
    networks:
      - mdm_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.socket().connect((\"127.0.0.1\", 8002))' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
